<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Calcule e compare a taxa efetiva de crédito e débito das operadoras de pagamento do Brasil.">
    <title>Calculadora de Taxas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23004b87'/><rect x='28' y='20' width='44' height='60' rx='8' fill='none' stroke='white' stroke-width='4'/><rect x='34' y='26' width='32' height='10' rx='2' fill='white'/><rect x='34' y='40' width='15' height='15' rx='3' fill='%23ff6600'/><text x='41.5' y='52' font-family='sans-serif' font-weight='bold' font-size='12' fill='white' text-anchor='middle'>%25</text><rect x='51' y='40' width='15' height='7' rx='2' fill='white'/><rect x='34' y='57' width='7' height='7' rx='1.5' fill='white'/><rect x='42' y='57' width='7' height='7' rx='1.5' fill='white'/><rect x='51' y='49' width='15' height='15' rx='3' fill='white'/></svg>">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/icons8-calculator-16.png">
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="./js/menu.js" defer></script>
    <script type="module" src="./js/comparador.js"></script>
</head>

<body class="corpo" id="corpo">

    <header class="cabecalho">
        <div class="cabecalho__barra">
            <button class="menu-botao" id="menuBotao" type="button" aria-expanded="false" aria-controls="menu"
                aria-label="Abrir menu">
                <span class="material-symbols-outlined" aria-hidden="true">menu</span>
            </button>
            <h1 class="cabecalho__titulo">Calculadora de Taxas</h1>
        </div>
        <nav class="menu" id="menu" hidden>
            <ul class="menu__lista">
                <li><a href="./index.html" class="menu__link" aria-current="page">Calculadora de Taxas</a></li>
                <li><a href="./simulador.html" class="menu__link">Simulador de vendas</a></li>
                <li><a href="./antecipacao-programada.html" class="menu__link">Antecipação programada</a></li>
            </ul>
        </nav>
    </header>

    <main class="app">

        <fieldset class="modo">
            <legend class="modo__legenda">O que você quer fazer</legend>
            <div class="modo__opcoes">
                <label class="modo__opcao">
                    <input type="radio" name="modo" value="unica" data-modo>
                    <span>Calcular uma operadora</span>
                </label>
                <label class="modo__opcao">
                    <input type="radio" name="modo" value="comparar" data-modo checked>
                    <span>Comparar duas</span>
                </label>
            </div>
        </fieldset>

        <section class="historico" id="historico" hidden>
            <div class="historico__topo">
                <h2 class="historico__titulo">Últimas propostas</h2>
                <button class="historico__limpar" id="limparHistorico" type="button">Limpar</button>
            </div>
            <ul class="historico__lista" id="historicoLista"></ul>
        </section>

        <div class="lados" id="lados"></div>

        <div class="acoes">
            <p class="aviso" id="aviso" role="alert"></p>
            <button class="calculadora__botao" id="calcular" type="button">Calcular</button>
        </div>

        <section class="saida" id="saida" aria-live="polite"></section>

        <section class="envio" id="envio" hidden>
            <h2 class="envio__titulo">Enviar proposta</h2>

            <div class="envio__campo">
                <label class="envio__rotulo" for="cliente">Nome do cliente (opcional)</label>
                <input class="envio__input" id="cliente" type="text" autocomplete="off"
                    placeholder="Ex.: Padaria do Zé">
            </div>

            <fieldset class="envio__grupo">
                <legend class="envio__rotulo">Formato do documento</legend>
                <div class="seletor">
                    <label class="seletor__opcao">
                        <input type="radio" name="formato" value="imagem" checked>
                        <span>Imagem</span>
                    </label>
                    <label class="seletor__opcao">
                        <input type="radio" name="formato" value="pdf">
                        <span>PDF</span>
                    </label>
                </div>
            </fieldset>

            <button class="envio__botao envio__botao--principal" id="compartilhar" type="button">
                Compartilhar documento
            </button>
            <p class="envio__dica" id="dicaEnvio"></p>

            <p class="envio__rotulo envio__rotulo--secao">Ou mandar só o resumo em texto</p>
            <div class="canais">
                <button class="envio__botao" data-canal="whatsapp" type="button">WhatsApp</button>
                <button class="envio__botao" data-canal="email" type="button">E-mail</button>
                <button class="envio__botao" data-canal="sms" type="button">SMS</button>
            </div>

            <button class="envio__botao envio__botao--discreto" id="baixar" type="button">
                Baixar documento
            </button>

            <p class="envio__estado" id="envioEstado" role="status"></p>
        </section>

    </main>

    <footer class="rodape">
        <span class="rodape__texto">
            Desenvolvido por Murilo
        </span>
        <a href="https://www.linkedin.com/in/murilo-freitas-de-souza-862a5121b/" target="_blank"
            rel="noopener"><img class="linkedin-logo" src="./img/linkedin-in.svg" alt="LinkedIn de Murilo"></a>
    </footer>

</body>

</html>
