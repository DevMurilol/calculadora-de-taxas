<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./simulador.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Simulador de Vendas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23004b87'/><rect x='28' y='20' width='44' height='60' rx='8' fill='none' stroke='white' stroke-width='4'/><rect x='34' y='26' width='32' height='10' rx='2' fill='white'/><rect x='34' y='40' width='15' height='15' rx='3' fill='%23ff6600'/><text x='41.5' y='52' font-family='sans-serif' font-weight='bold' font-size='12' fill='white' text-anchor='middle'>%25</text><rect x='51' y='40' width='15' height='7' rx='2' fill='white'/><rect x='34' y='57' width='7' height='7' rx='1.5' fill='white'/><rect x='42' y='57' width='7' height='7' rx='1.5' fill='white'/><rect x='51' y='49' width='15' height='15' rx='3' fill='white'/></svg>">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/icons8-calculator-16.png">
    <script src="./js/menu.js" defer></script>
    <script src="./js/simulador.js" defer></script>
</head>
<body class="corpo" id="corpo">

<header class="cabecalho">
    <div class="cabecalho__barra">
        <button class="menu-botao" id="menuBotao" type="button" aria-expanded="false" aria-controls="menu"
            aria-label="Abrir menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <h1 class="cabecalho__titulo">Simulador de Vendas</h1>
    </div>
    <nav class="menu" id="menu" hidden>
        <ul class="menu__lista">
            <li><a href="./index.html" class="menu__link">Calculadora de Taxas</a></li>
            <li><a href="./simulador.html" class="menu__link" aria-current="page">Simulador de vendas</a></li>
            <li><a href="./antecipacao-programada.html" class="menu__link">Antecipação programada</a></li>
        </ul>
    </nav>
</header>

    <div class="taxa-concorrencia" id="taxaStone" >
        <H2 class="taxa-concorrencia__titulo">Calcular taxa da venda:</H2>
        <input class="taxa-concorrencia__botao" onclick="mudaSimulacao()"
            type="checkbox"><br>
    </div>
    <section class="calculadora" id="simuladorDeVendas">
        <label for="taxaPraticada">Taxa praticada na transação (%):</label>
        <input class="digitar-texto-simulador" placeholder="%" type="number" id="taxaPraticada" step="0.01"><br>

        <label for="taxaMdrCreditoAvista">Valor que deseja receber:</label>
        <input class="digitar-texto-simulador" placeholder="R$" type="number" id="valorReceber" step="0.01"><br>
        <button class="calculadora__botao" onclick="simular()">Calcular</button><br><br>
    </section>
    <section class="calculadora" id="simuladorDeTaxaAplicada">
        <label for="valorRecebido">Valor recebido na venda:</label>
        <input class="digitar-texto-simulador" placeholder="R$" type="number" id="valorRecebido" step="0.01"><br>

        <label for="valorCobrado">Valor cobrado na venda:</label>
        <input class="digitar-texto-simulador" placeholder="R$" type="number" id="valorCobrado" step="0.01"><br>
        <button class="calculadora__botao" onclick="simular()">Calcular</button><br><br>
    </section>
    <section class="resultados">
        <h2 id="resultadosSimulador" class="resultados-simulador"></h2>
    </section>
<footer class="rodape">
    <span class="rodape__texto">
        Desenvolvido por Murilo
    </span>
    <a href="https://www.linkedin.com/in/murilo-freitas-de-souza-862a5121b/" target="_blank"><img class="linkedin-logo"
            src="./img/linkedin-in.svg" alt="logo linkedin"></a>
</footer>

</body>

</html>
